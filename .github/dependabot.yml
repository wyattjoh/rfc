version: 2

# Dependabot's Bun updater currently supports bun.lock lockfileVersion 1,
# while the repository's current Bun release writes lockfileVersion 2.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
