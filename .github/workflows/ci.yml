name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.4.2"
      # Dev dependencies are required: the MCP client used by the server tests
      # is one, and omitting them fails the build rather than skipping tests.
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      # Never pipe this: reading a pipeline's status hides a real failure.
      # The suite needs no credential, no credential manager and no network.
      - run: bun test packages
